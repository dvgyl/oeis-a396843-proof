related_formalizations: []

status:
  scope: >-
    The theorems listed under alignment are stated in Challenges/ using Mathlib alone and are proved
    in Solutions/ from the library in Hanna/, Consecutive/ and Families/; Entries/ restates the results
    of each paper in the notation of the library. Three steps are proved only in the accompanying
    papers: that the one-sided theta-type sums used for A380060 and A380680 equal the two-sided sums
    of the OEIS entries; that the nested square in the name of A392210 defines the solution of
    formula (1) of the entry; and, for A397346, the passage from A' = A*H' and A(0) = 1 to
    A = exp(H). Observations in the Discussion sections of the papers are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

fidelity:
  divergences: >-
    A380060 and A380680 are formalized with the one-sided form of the theta-type sum, and A392210
    with formula (1) of its entry; the papers prove the equivalence with the OEIS definitions. A397346
    is formalized through formula (7) of its entry together with the identity A' = A*H'. A393171 is
    stated with the Catalan series characterized by C = x + C^2 and C(0) = 0; A378580 and A378581 with
    the theta series characterized by its coefficients; A380056 over the rationals, with
    a(n) = n!*[x^n]A; and A394576 with the index shifted by one. All other entries use the defining
    equation of the OEIS entry.

automation:
  methods:
    - method: autonomous
      models: ["GPT-6 (ChatGPT, Pro reasoning)"]
      framework: "ChatGPT"
      tool_setup: "Working autonomously from prompts by Dev D. Goyal, searched the OEIS for candidate conjectures, found the proofs, counterexamples and corrected statements, and wrote the Lean library (Hanna/, Consecutive/, Families/, Entries/) and first drafts of the papers."
    - method: agent
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Rebuilt the Lean project from source, audited the axioms, compared the Lean definitions with the OEIS entries, wrote the numerical checks in verification/, ported the project to Lean 4.35.0 and the module system, wrote the Challenge and Solution modules and the Comparator configurations, and wrote the papers in their present form."
  notes: "Dev D. Goyal directed the project, chose the problems, requested proofs, formal verification and revisions, and reviewed the results, but did not supply proof strategies. AUTHORSHIP.md at the repository root records each contribution."

review:
  status: agent-reviewed
  reviewers: ["Claude Opus 5.5 (Claude Code)", "Dev D. Goyal"]
  notes: "An agent separate from the one that wrote the proofs rebuilt the formalization, checked that every theorem depends only on the standard axioms, compared each Lean definition with its OEIS entry, recomputed every sequence from its OEIS definition and tested the results numerically, and read the proofs in the papers. Dev D. Goyal reviewed the proofs; this review is not an independent expert validation. The papers have not been peer reviewed."

alignment:
  namespace: "OEISProofs"
  statements:
    - source: "A396843, A396844 (definition)"
      lean: "OEISProofs.HannaFamily.existsUnique"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "Existence and uniqueness of the normalized solution for every integer m."
    - source: "A396843, first conjecture (m = 3)"
      lean: "OEISProofs.HannaFamily.odd_coeff"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "Odd m: every coefficient a(n), n >= 1, is odd."
    - source: "Paper on A396843, parity for even m"
      lean: "OEISProofs.HannaFamily.even_coeff"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "Even m: a(n) is even for n >= 2."
    - source: "Paper on A396843, residues modulo m^2"
      lean: "OEISProofs.HannaFamily.modEq_sq"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "Residues modulo m^2 for every m >= 2."
    - source: "Paper on A396843, binary-digit divisibility"
      lean: "OEISProofs.HannaFamily.pow_digitSum_dvd"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "m^s divides a(n), s the binary digit sum of n - 1."
    - source: "Paper on A396843, prime exponents"
      lean: "OEISProofs.HannaFamily.prime_pow_dvd"
      module: "Challenges.HannaFamily"
      status: "proved"
      note: "Lower bound and exact case for the exponent of a prime dividing m."
    - source: "A396843, second conjecture (residues modulo 9)"
      lean: "OEISProofs.HannaFamily.residues_mod_nine"
      module: "Challenges.HannaFamily"
      status: "disproved and corrected"
      note: "The conjectured classification is false; this is the correct one."
    - source: "A396844, conjecture (residues modulo 16)"
      lean: "OEISProofs.HannaFamily.residues_mod_sixteen"
      module: "Challenges.HannaFamily"
      status: "disproved and corrected"
      note: "The conjectured classification fails from n = 17; this is the correct one."
    - source: "A396099, A396798, A396807 (definition)"
      lean: "OEISProofs.ConsecutiveIterates.existsUnique"
      module: "Challenges.ConsecutiveIterates"
      status: "proved"
      note: "Existence and uniqueness for every r."
    - source: "A396807 conjectures; A396798 conjectures on iterates"
      lean: "OEISProofs.ConsecutiveIterates.iterate_coeff_modEq"
      module: "Challenges.ConsecutiveIterates"
      status: "proved"
      note: "Every nonnegative iterate modulo 2r, for every r >= 1."
    - source: "A396807, iterates with negative index"
      lean: "OEISProofs.ConsecutiveIterates.inverse_iterate_coeff_modEq"
      module: "Challenges.ConsecutiveIterates"
      status: "proved"
      note: "Iterates of the compositional inverse modulo 2r."
    - source: "A396099, four conjectures modulo 4"
      lean: "OEISProofs.ConsecutiveIterates.a396099_conjectures"
      module: "Challenges.ConsecutiveIterates"
      status: "proved"
    - source: "A396798, first conjecture (modulo 8)"
      lean: "OEISProofs.ConsecutiveIterates.a396798_residues"
