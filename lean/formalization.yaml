fidelity:
  divergences: >-
    For A380060 and A380680 the Lean definition uses the one-sided form of the theta-type sum; the papers
    prove that it equals the two-sided sum in the OEIS titles. For A392210 the Lean definition is the
    functional equation; the papers derive the nested-square title from it. For A397346 the Lean
    definition is formula (7) of the entry and Lean proves the identity A' = A H'; the final step to
    A = exp(H) is proved in the paper. All other entries are
    defined in Lean by the defining equation or formula of the OEIS entry.

automation:
  methods:
    - method: autonomous
      models: ["GPT-6 (ChatGPT, Pro reasoning)"]
      framework: "ChatGPT"

review:
  status: author-verified
  notes: >-
    Verified by the author. Independently rebuilt from source and audited (axioms, definitions
    against the OEIS entries) with Claude Opus 5.5 in Claude Code. Not peer reviewed.

