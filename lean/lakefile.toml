name = "oeis_proofs"
version = "1.0.0"
defaultTargets = ["Hanna", "Consecutive", "Related", "Families", "Entries", "Challenges", "Solutions"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Hanna"

[[lean_lib]]
name = "Consecutive"

[[lean_lib]]
name = "Related"

[[lean_lib]]
name = "Families"

[[lean_lib]]
name = "Entries"

[[lean_lib]]
name = "Challenges"
globs = ["Challenges.+"]

[[lean_lib]]
name = "Solutions"
globs = ["Solutions.+"]
